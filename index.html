<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe Genius</title>
<script>
  (function () {
    try {
      var settings = JSON.parse(localStorage.getItem('recipe-genius:settings'));
      if (settings && (settings.theme === 'light' || settings.theme === 'dark')) {
        document.documentElement.setAttribute('data-theme', settings.theme);
      }
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/print.css" media="print">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="app-header">
  <a href="#/">Recipe Genius</a>
  <nav aria-label="Primary">
    <a href="#/">Browse</a>
    <a href="#/settings">Settings</a>
  </nav>
</header>
<main id="main" tabindex="-1"></main>
<div aria-live="polite" class="skip-link" id="live-region"></div>
<footer class="app-footer">
  <a id="sync-status" href="https://github.com/pauladeland/recipe_genius/actions/workflows/sync-recipes.yml">Checking sync&hellip;</a>
</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
